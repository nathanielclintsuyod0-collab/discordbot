<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b12">
  <title>BetterCalc</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div>
        <h1>BetterCalc</h1>
        <span>the calculator that doesn't calculate</span>
      </div>

      <button
        id="soundBtn"
        class="icon-btn"
        type="button"
        aria-label="Toggle sound"
      >
        🔊
      </button>
    </header>


    <section class="calculator">

      <div class="display">

        <div
          id="expression"
          class="expression"
        ></div>

        <div
          id="result"
          class="result"
        >
          0
        </div>

        <div
          id="lyric"
          class="lyric"
        ></div>

        <div
          id="status"
          class="status"
        ></div>

      </div>


      <div class="keys">

        <button
          class="key danger"
          type="button"
          data-action="clear"
        >
          AC
        </button>

        <button
          class="key"
          type="button"
          data-action="delete"
        >
          ⌫
        </button>

        <button
          class="key operator"
          type="button"
          data-value="%"
        >
          %
        </button>

        <button
          class="key operator"
          type="button"
          data-value="/"
        >
          ÷
        </button>


        <button
          class="key"
          type="button"
          data-value="7"
        >
          7
        </button>

        <button
          class="key"
          type="button"
          data-value="8"
        >
          8
        </button>

        <button
          class="key"
          type="button"
          data-value="9"
        >
          9
        </button>

        <button
          class="key operator"
          type="button"
          data-value="*"
        >
          ×
        </button>


        <button
          class="key"
          type="button"
          data-value="4"
        >
          4
        </button>

        <button
          class="key"
          type="button"
          data-value="5"
        >
          5
        </button>

        <button
          class="key"
          type="button"
          data-value="6"
        >
          6
        </button>

        <button
          class="key operator"
          type="button"
          data-value="-"
        >
          −
        </button>


        <button
          class="key"
          type="button"
          data-value="1"
        >
          1
        </button>

        <button
          class="key"
          type="button"
          data-value="2"
        >
          2
        </button>

        <button
          class="key"
          type="button"
          data-value="3"
        >
          3
        </button>

        <button
          class="key operator"
          type="button"
          data-value="+"
        >
          +
        </button>


        <button
          class="key zero"
          type="button"
          data-value="0"
        >
          0
        </button>

        <button
          class="key"
          type="button"
          data-value="."
        >
          .
        </button>

        <button
          class="key equals"
          type="button"
          data-action="equals"
        >
          =
        </button>

      </div>

    </section>


    <p class="keyboard-tip">
      Keyboard supported • Enter = play • Esc = clear
    </p>

  </main>
  
<audio id="song" preload="auto">
    <source src="song.mp3" type="audio/mpeg">
</audio>

<script src="./script.js"></script>

</body>
</html>
